<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thanksgiving · TV</title>
<meta name="theme-color" content="#f4ede0">
<meta name="robots" content="noindex">
<link rel="icon" href="apple-touch-icon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tv.css?v=1">
</head>
<body>
<main class="frame">
  <div id="stage" class="stage" aria-live="polite"></div>
  <footer class="bar">
    <span class="live" id="live"><span class="dot"></span>Live</span>
    <span class="dots" id="dots"></span>
    <span class="clock" id="clock"></span>
  </footer>
  <i class="progress" id="progress"></i>
</main>
<div class="note" id="note" role="status"></div>
<button type="button" class="start" id="start">
  <span class="eyebrow">Thanksgiving · TV mode</span>
  <b>Tap to begin</b>
  <span class="hint">Goes full screen and keeps the screen awake. Arrow keys or a tap move between slides.</span>
</button>
<script src="config.js?v=21"></script>
<script src="live.js?v=21"></script>
<script src="tv.js?v=1"></script>
</body>
</html>
